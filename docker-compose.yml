services:
  backend:
    image: vedant108/notes-app:latest
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE}
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:


